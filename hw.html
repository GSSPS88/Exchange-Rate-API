<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Rate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@100..900&display=swap");

        * {
            box-sizing: border-box;
            font-family: 'Poppins';
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #f1f1f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .btn {
            color: #fff;
            background-color: #0e0e0e;
            cursor: pointer;
            border-radius: 5px;
            font-size: 15px;
            padding: 8px 12px;
        }
        
        .money-img {
            width: 210px;
        }
        
        .currency {
            padding: 30px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .currency select {
            padding: 10px 20px 10px 20px;
            border: 1px solid #dedede;
            font-size: 16px;
            background: transparent;
            appearance: none;
        }
        
        .currency input {
            padding: 9px 20px 10px 20px;
            border: 1px solid #dedede;
            background: transparent;
            font-size: 16px;
            text-align: right;
        }
        
        .swap-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .rate {
            font-size: 15px;
            padding: 0 10px;
        }
        
        select:focus, input:focus, button:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <img src="img/money.png" alt="" srcset="" class="money-img">
    <h1><i><i class="bi bi-currency-exchange"></i> Currency Converter</i></h1>
    <div class="container">
        <div class="currency">
            <select name="" id="currency-one">
                <option value="USD" selected>USD</option>
                <option value="LAK">LAK</option>
                <option value="THB">THB</option>
                <option value="CNY">CNY</option>
                <option value="VND">VND</option>
                <option value="JPY">JPY</option>
                <option value="KRW">KRW</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
            </select>
            <input type="number" name="" id="amount-one" value="1">
        </div>

        <div class="swap-container">
            <button class="btn" id="btn"><i class="bi bi-arrow-down-up"></i></button>
            <div class="rate" id="rate"> currency rate: </i></div>
        </div>

        <div class="currency">
            <select name="" id="currency-two">
                <option value="USD">USD</option>
                <option value="LAK" selected>LAK</option>
                <option value="THB">THB</option>
                <option value="CNY">CNY</option>
                <option value="VND">VND</option>
                <option value="JPY">JPY</option>
                <option value="KRW">KRW</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
            </select>
            <input type="number" name="" id="amount-two" value="1">
        </div>
    </div>

    <script>
        const currency_1 = document.getElementById("currency-one");
        const currency_2 = document.getElementById("currency-two");

        const amount_1 = document.getElementById("amount-one");
        const amount_2 = document.getElementById("amount-two");

        const swap = document.getElementById("btn");
        const showRate = document.getElementById("rate");

        currency_1.addEventListener('change', currencyConverter);
        currency_2.addEventListener('change', currencyConverter);

        amount_1.addEventListener('input', currencyConverter);
        amount_2.addEventListener('input', currencyConverter);

        function currencyConverter() {
            const one = currency_1.value;
            const two = currency_2.value;
            fetch(`https://api.exchangerate-api.com/v4/latest/${one}`)
            .then(res => res.json())
            .then(data=> {
                console.log(data);
                const rate = data.rates[two];
                showRate.innerHTML =  `1 ${one} = ${rate} ${two}`;
            
                amount_2.value = (amount_1.value * rate).toFixed(2);
            });
        }

        swap.addEventListener('click',() => {
            const swapBtn = currency_1.value;
            currency_1.value = currency_2.value;
            currency_2.value = swapBtn;
        
            currencyConverter();
        });

        currencyConverter();


    </script>
</body>
</html>
